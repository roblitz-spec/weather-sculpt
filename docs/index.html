<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather-Sculpt — 用真实 ERA5 气象场雕刻</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px 48px}
  .wrap{width:100%;max-width:960px}
  h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 20px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:16px;display:flex;gap:14px}
  .canvasbox{flex:1;position:relative}
  canvas#map{width:100%;display:block;border-radius:8px;background:#05070a;aspect-ratio:2/1;object-fit:cover}
  .cb{width:18px;border-radius:6px;position:relative}
  .cbwrap{display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:10px;color:var(--dim)}
  .ts{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;
      font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;padding:5px 8px;border-radius:6px;letter-spacing:.5px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#05070a;border:0;border-radius:8px;
         padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button:active{transform:translateY(1px)}
  .pill{color:var(--dim);font-size:12px}
  input[type=range]{accent-color:var(--accent);width:220px}
  .foot{margin-top:22px;color:var(--dim);font-size:12px;line-height:1.7;max-width:960px}
  .foot a{color:var(--accent);text-decoration:none}
  .tag{display:inline-block;background:var(--panel);border:1px solid var(--line);
       color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weather-Sculpt</h1>
  <p class="sub">用真实的 <b>ERA5</b> 气象场雕刻出视频、GIF 和声音 · 此处为浏览器实时演示（全球 2&nbsp;m 温度，每 24 小时一帧，共 7 天）</p>

  <div class="stage">
    <div class="canvasbox">
      <canvas id="map" width="900" height="450"></canvas>
      <div class="ts" id="ts">…</div>
    </div>
    <div class="cbwrap">
      <span id="cmax">35</span>
      <canvas id="cb" class="cb" width="18" height="300"></canvas>
      <span id="cmin">10</span>
    </div>
  </div>

  <div class="bar">
    <button id="play">⏸ 暂停</button>
    <label class="pill">速度 <input type="range" id="speed" min="1" max="24" value="6"></label>
    <label class="pill">时间 <input type="range" id="seek" min="0" max="7" value="0" step="1"></label>
    <span class="pill" id="fps"></span>
  </div>

  <div class="foot">
    <span class="tag">真实数据</span><span class="tag">0.25° 重分析</span><span class="tag">CC-BY 4.0</span><br>
    数据：ECMWF <b>ERA5</b> 再分析（Hersbach et&nbsp;al., 2020, DOI 10.24381/c010a562）。
    本演示由 <b>Weather-Sculpt</b> 引擎从真实气象场雕刻而成，非合成纹理。
    完整产品（全球 7 天 + 中国 30 天，5 变量，视频/音频雕刻）见
    <a href="https://github.com/roblitz-spec/weather-sculpt">GitHub</a>。
  </div>
</div>

<script src="weather_demo_data.js"></script>
<script>
(function(){
  const D = window.WS_DATA;
  const H = D.h, W = D.w;
  const CMIN = D.cmin, CMAX = D.cmax;

  // 解码 base64 -> Float32Array (每帧 H*W, 行优先)
  const frames = D.frames.map(b64 => {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    return new Float32Array(u8.buffer);
  });

  // RdYlBu_r 风格色标: 冷(蓝) -> 中(白) -> 暖(红)
  const stops = [
    [0.00,  5,  44, 130],
    [0.25, 33,102,172],
    [0.50,247,247,247],
    [0.75,253,141, 60],
    [1.00,103,  0, 31],
  ];
  function color(t){
    t = t<0?0:t>1?1:t;
    for (let i=1;i<stops.length;i++){
      if (t<=stops[i][0]){
        const a=stops[i-1], b=stops[i];
        const f=(t-a[0])/(b[0]-a[0]);
        return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
      }
    }
    return stops[stops.length-1].slice(1);
  }
  // 预计算 256 级 LUT
  const LUT = new Uint8ClampedArray(256*3);
  for (let i=0;i<256;i++){ const c=color(i/255); LUT[i*3]=c[0];LUT[i*3+1]=c[1];LUT[i*3+2]=c[2]; }

  const map = document.getElementById('map');
  const ctx = map.getContext('2d');
  const img = ctx.createImageData(W, H);

  // 画布是 2:1, 数据 1° 网格 181x360, 直接缩放
  function render(frame){
    const f = frames[frame];
    const px = img.data;
    for (let r=0;r<H;r++){
      for (let c=0;c<W;c++){
        const v = f[r*W+c];
        const o = (r*W+c)*4;
        if (!isFinite(v)) { px[o]=5;px[o+1]=7;px[o+2]=10;px[o+3]=255; continue; }
        let t = (v-CMIN)/(CMAX-CMIN);
        t = t<0?0:t>1?1:t;
        const li = (t*255|0)*3;
        px[o]=LUT[li]; px[o+1]=LUT[li+1]; px[o+2]=LUT[li+2]; px[o+3]=255;
      }
    }
    // 缩放到画布尺寸
    const tmp = document.createElement('canvas');
    tmp.width=W; tmp.height=H;
    tmp.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.clearRect(0,0,map.width,map.height);
    ctx.drawImage(tmp,0,0,map.width,map.height);
    document.getElementById('ts').textContent = D.times[frame];
  }

  // 色条
  (function(){
    const cb=document.getElementById('cb'), c=cb.getContext('2d');
    const g=c.createLinearGradient(0,cb.height,0,0);
    for (let i=0;i<=10;i++) g.addColorStop(i/10, rgb(i/10));
    c.fillStyle=g; c.fillRect(0,0,cb.width,cb.height);
    function rgb(t){const cc=color(t);return `rgb(${cc[0]|0},${cc[1]|0},${cc[2]|0})`;}
    document.getElementById('cmax').textContent=CMAX+'°C';
    document.getElementById('cmin').textContent=CMIN+'°C';
  })();

  let frame=0, playing=true, interval=null;
  const N=frames.length;
  function speedMs(){ return 1000 / (+document.getElementById('speed').value); }
  function loop(){
    if (!playing) return;
    frame = (frame+1)%N;
    render(frame);
    document.getElementById('seek').value = frame;
    clearTimeout(interval);
    interval = setTimeout(loop, speedMs());
  }
  function setPlaying(p){
    playing=p;
    document.getElementById('play').textContent = p?'⏸ 暂停':'▶ 播放';
    if (p) loop(); else clearTimeout(interval);
  }
  document.getElementById('play').onclick=()=>setPlaying(!playing);
  document.getElementById('speed').oninput=()=>{ if(playing){clearTimeout(interval);interval=setTimeout(loop,speedMs());} };
  document.getElementById('seek').oninput=e=>{ frame=+e.target.value; render(frame); };

  render(0);
  setPlaying(true);
})();
</script>
</body>
</html>
